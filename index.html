<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雙人遊戲平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎮 雙人遊戲平台</h1>

  <div class="score">
    <div class="s1"><span id="nm1">玩家1</span> <span id="sc1">0</span></div>
    <span>VS</span>
    <div class="s2"><span id="nm2">玩家2</span> <span id="sc2">0</span></div>
    <button onclick="resetScore()">歸零</button>
  </div>


  <!-- 線上連線面板 -->
  <div class="net">
    <div id="netIdle">
      <button id="btnHost">🌐 建立線上房間</button>
      <span class="or">或</span>
      <input id="joinCode" maxlength="5" placeholder="輸入房間代碼" autocomplete="off">
      <button id="btnJoin">加入</button>
    </div>
    <div id="netInfo" style="display:none"></div>
  </div>

  <div class="menu" id="menu"></div>

  <div id="game">
    <div class="bar">
      <button onclick="back()">← 返回大廳</button>
      <button onclick="current.start()">🔄 重新開始</button>
    </div>
    <h2 id="gtitle"></h2>
    <div id="msg"></div>
    <div id="stage"></div>
  </div>

  <footer>
    同一台裝置雙人對戰,或建立線上房間跟朋友玩<br>
    玩家1:W A S D / A / F ・ 玩家2:方向鍵 / L / Enter(各遊戲內會標示)<br>
    線上模式:房主是玩家1,朋友是玩家2(朋友也可用 W A S D 代替方向鍵、F 代替 Enter)
  </footer>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
  <script src="extra.js"></script>
  <script src="net.js"></script>
  <script src="social.js"></script>
</body>
</html>
